/* 기한부 할인 반영: 오늘 날짜(로컬)가 promo.until 이하이면 할인가 */
function effectivePrice(m) {
  if (m.promo) {
    const d = new Date();
    const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (today <= m.promo.until) return { in: m.promo.in, out: m.promo.out, promo: true };
  }
  return { in: m.in, out: m.out, promo: false };
}

function buildCombinedInstruction(ids) {
  const ordered = ALL_QIDS.filter((id) => ids.includes(id));
  const items = ordered.map((id, i) => `${i + 1}) [${id}] ${Q_LABEL[id]}\n   ${Q_INST[id]}`).join("\n\n");
  return (
    `아래 ${ordered.length}개의 분석 질문에 대해 한 번에 모두 답하라.\n` +
    `각 답변은 반드시 "## [질문ID] 질문제목" 형식의 머리말로 시작하고, 제시된 순서대로 작성하라.\n` +
    `각 질문은 독립된 절로 충분히 답하되, 앞 절과 겹치는 내용은 되풀이하지 말고 필요하면 간단히 가리켜라.\n\n` +
    items +
    `\n\n[요구사항 반영 지침]\n` +
    `본문 앞에 '작가가 제공한 배경 정보 및 요구사항'이 있다면 다음을 따르라.\n` +
    `- 특정 질문을 더 자세히/깊이 분석해 달라는 요청이 있으면 해당 절을 더 길고 구체적으로 작성하라.\n` +
    `- '가능한 독법'에 추가하라고 명시한 관점이 있으면 그 관점을 V-5 절에 반드시 포함하라.\n` +
    `- 위 목록에 없는, 사용자가 직접 적은 질문이 있으면 그에 대한 답을 맨 마지막에 "## 7. 추가 질문" 절로 따로 작성하라. 그런 질문이 없으면 이 절은 만들지 마라.`
  );
}

function estTokens(str) {
  if (!str) return 0;
  let cjk = 0, other = 0;
  for (const ch of str) {
    const c = ch.codePointAt(0);
    if ((c >= 0xac00 && c <= 0xd7a3) || (c >= 0x3000 && c <= 0x9fff)) cjk++; else other++;
  }
  return Math.ceil(cjk * 1.1 + other * 0.3);
}
const estWords = (str) => (str && str.trim() ? str.trim().split(/\s+/).length : 0);
const usd = (n) => "$" + n.toFixed(4);
const krw = (n) => "₩" + Math.round(n * KRW_RATE).toLocaleString();
const xmlEsc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const escapeHtml = xmlEsc;
const inlineMd = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

function mdToHtml(text) {
  const lines = escapeHtml(text).split(/\r?\n/);
  let html = "", para = [];
  const flush = () => { if (para.length) { html += `<p>${para.join("<br>")}</p>`; para = []; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flush(); const lvl = Math.min(h[1].length + 1, 4); html += `<h${lvl}>${inlineMd(h[2])}</h${lvl}>`; continue; }
    if (line.trim() === "") { flush(); continue; }
    para.push(inlineMd(line));
  }
  flush();
  return html;
}

async function askModel({ provider, model, apiKey, maxTokens, info, work, instruction, caching }) {
  const key = (apiKey || "").trim();
  const stable = buildStable(info, work);
  const variable = `\n\n${instruction}`;

  if (provider === "gemini") {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
    const res = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: "user", parts: [{ text: stable + variable }] }],
        generationConfig: { maxOutputTokens: maxTokens },
      }),
    });
    if (!res.ok) { let d = `HTTP ${res.status}`; try { const e = await res.json(); if (e?.error?.message) d = e.error.message; } catch (_) {} throw new Error(d); }
    const data = await res.json();
    const cand = data.candidates && data.candidates[0];
    let text = (cand?.content?.parts || []).map((p) => p.text || "").join("").trim();
    const um = data.usageMetadata || {};
    const inTok = um.promptTokenCount || 0;
    const outTok = (um.candidatesTokenCount || 0) + (um.thoughtsTokenCount || 0);
    const cacheRead = um.cachedContentTokenCount || 0;
    if (!text) {
      if (cand?.finishReason === "MAX_TOKENS") text = "(출력 상한에 막혀 본문이 비었거나 잘렸습니다. Gemini 3.x는 내부 '사고 토큰'도 출력 상한에서 소모하므로 출력 상한을 넉넉히 올려 다시 시도하세요.)";
      else if (cand?.finishReason === "SAFETY") text = "(안전 필터로 응답이 차단되었습니다.)";
      else text = "(빈 응답)";
    }
    return { text, inTok, outTok, cacheRead, cacheWrite: 0 };
  }

  if (provider === "openai") {
    /* Responses API. 캐싱 체크 시 본문 블록 끝에 명시적 캐시 지점을 둔다.
       explicit 모드에서 지점이 없으면 캐싱·기록 할증 모두 발생하지 않음 */
    const stableBlock = { type: "input_text", text: stable };
    if (caching) stableBlock.prompt_cache_breakpoint = { mode: "explicit" };
    const res = await fetch("https://api.openai.com/v1/responses", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
      body: JSON.stringify({
        model,
        max_output_tokens: maxTokens,
        prompt_cache_options: { mode: "explicit" },
        input: [
          { role: "developer", content: [{ type: "input_text", text: SYSTEM_PROMPT }] },
          { role: "user", content: [stableBlock, { type: "input_text", text: variable }] },
        ],
      }),
    });
    if (!res.ok) { let d = `HTTP ${res.status}`; try { const e = await res.json(); if (e?.error?.message) d = e.error.message; } catch (_) {} throw new Error(d); }
    const data = await res.json();
    let text = "", refusal = "";
    for (const item of data.output || []) {
      if (item.type !== "message") continue;
      for (const c of item.content || []) {
        if (c.type === "output_text") text += c.text || "";
        else if (c.type === "refusal") refusal += c.refusal || "";
      }
    }
    if (!text && typeof data.output_text === "string") text = data.output_text;
    text = text.trim();
    const u = data.usage || {};
    const det = u.input_tokens_details || {};
    const truncated = data.status === "incomplete" && data.incomplete_details?.reason === "max_output_tokens";
    if (!text) {
      if (truncated) text = "(출력 상한에 막혀 본문이 비었습니다. GPT-6 계열은 내부 추론 토큰도 출력 상한에서 소모하므로 출력 상한을 넉넉히 올려 다시 시도하세요.)";
      else if (refusal) text = `(응답 거부: ${refusal})`;
      else text = "(빈 응답)";
    } else if (truncated) {
      text += "\n\n(※ 출력 상한에 도달해 여기서 잘렸습니다.)";
    }
    return { text, inTok: u.input_tokens || 0, outTok: u.output_tokens || 0, cacheRead: det.cached_tokens || 0, cacheWrite: det.cache_write_tokens || 0 };
  }

  const headers = { "Content-Type": "application/json" };
  if (key) { headers["x-api-key"] = key; headers["anthropic-version"] = "2023-06-01"; headers["anthropic-dangerous-direct-browser-access"] = "true"; }
  const system = caching ? [{ type: "text", text: SYSTEM_PROMPT, cache_control: { type: "ephemeral" } }] : SYSTEM_PROMPT;
  const content = caching
    ? [{ type: "text", text: stable, cache_control: { type: "ephemeral" } }, { type: "text", text: variable }]
    : stable + variable;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers,
    body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: [{ role: "user", content }] }),
  });
  if (!res.ok) { let d = `HTTP ${res.status}`; try { const e = await res.json(); if (e?.error?.message) d = e.error.message; } catch (_) {} throw new Error(d); }
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim() || "(빈 응답)";
  const u = data.usage || {};
  const uncached = u.input_tokens || 0;
  const cacheWrite = u.cache_creation_input_tokens || 0;
  const cacheRead = u.cache_read_input_tokens || 0;
  return { text, inTok: uncached + cacheWrite + cacheRead, outTok: u.output_tokens || 0, cacheRead, cacheWrite };
}

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function printHTML(html) {
  const w = window.open("", "_blank");
  if (w) { w.document.write(html); w.document.close(); w.focus(); setTimeout(() => w.print(), 500); return; }
  const f = document.createElement("iframe");
  Object.assign(f.style, { position: "fixed", right: "0", bottom: "0", width: "0", height: "0", border: "0" });
  document.body.appendChild(f);
  const d = f.contentWindow.document; d.open(); d.write(html); d.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (_) {} }, 600);
}
function loadJSZip() {
  return new Promise((resolve, reject) => {
    if (window.JSZip) return resolve(window.JSZip);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = () => (window.JSZip ? resolve(window.JSZip) : reject(new Error("JSZip 로드 실패")));
    s.onerror = () => reject(new Error("JSZip 로드 실패 (인터넷 연결 필요)"));
    document.head.appendChild(s);
  });
}

function inlineRuns(text) {
  const parts = String(text).split(/\*\*(.+?)\*\*/g);
  const runs = [];
  parts.forEach((p, i) => { if (p !== "") runs.push({ text: p, bold: i % 2 === 1 }); });
  if (runs.length === 0) runs.push({ text: " ", bold: false });
  return runs;
}
const paraXml = (style, runs) => {
  const r = runs.map((x) => `<w:r>${x.bold ? "<w:rPr><w:b/></w:rPr>" : ""}<w:t xml:space="preserve">${xmlEsc(x.text)}</w:t></w:r>`).join("");
  return `<w:p>${style ? `<w:pPr><w:pStyle w:val="${style}"/></w:pPr>` : ""}${r}</w:p>`;
};
const hStyle = (c) => (c <= 2 ? "Heading2" : c === 3 ? "Heading3" : "Heading4");

function buildDocumentXml({ title, modelLabel, info, text }) {
  const date = new Date().toLocaleString("ko-KR");
  let body = "";
  body += paraXml("Title", [{ text: title || "텍스트 분석", bold: false }]);
  body += paraXml("Meta", [{ text: `분석 모델 ${modelLabel} · ${date}`, bold: false }]);
  if (info && info.trim()) {
    body += paraXml("InfoHead", [{ text: "작가·작품 정보 및 요구사항", bold: false }]);
    info.replace(/\r/g, "").split("\n").forEach((line) => { body += paraXml("Info", inlineRuns(line.length ? line : " ")); });
  }
  text.replace(/\r/g, "").split("\n").forEach((raw) => {
    const line = raw.replace(/\s+$/, "");
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { body += paraXml(hStyle(h[1].length), inlineRuns(h[2])); return; }
    if (line.trim() === "") return;
    body += paraXml("", inlineRuns(line));
  });
  return DOCX_DOC_OPEN + body + DOCX_DOC_CLOSE;
}

async function makeDocxBlob({ title, modelLabel, info, text }) {
  const JSZipLib = await loadJSZip();
  const zip = new JSZipLib();
  zip.file("[Content_Types].xml", DOCX_CONTENT_TYPES);
  zip.folder("_rels").file(".rels", DOCX_RELS);
  const wf = zip.folder("word");
  wf.file("styles.xml", DOCX_STYLES);
  wf.folder("_rels").file("document.xml.rels", DOCX_DOCRELS);
  wf.file("document.xml", buildDocumentXml({ title, modelLabel, info, text }));
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

`;

function App() {
  const [provider, setProvider] = useState("claude");
  const [model, setModel] = useState(MODELS.claude.list[0].id);
  const [apiKey, setApiKey] = useState("");
  const [maxTokens, setMaxTokens] = useState(4096);
  const [caching, setCaching] = useState(true);
  const [info, setInfo] = useState("");
  const [work, setWork] = useState("");
  const [title, setTitle] = useState("");
  const [selected, setSelected] = useState({});
  const [result, setResult] = useState(null);
  const [running, setRunning] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [usage, setUsage] = useState({ inTok: 0, outTok: 0, cacheRead: 0, cost: 0, calls: 0 });

  const prov = MODELS[provider];
  const curModel = prov.list.find((m) => m.id === model) || prov.list[0];
  const price = effectivePrice(curModel);
  const priceIn = price.in / 1e6, priceOut = price.out / 1e6;
  const CR = curModel.cr, CW = curModel.cw;

  const selectedIds = useMemo(() => ALL_QIDS.filter((id) => selected[id]), [selected]);
  const n = selectedIds.length;
  const canRun = work.trim().length > 0 && n > 0 && !running;
  const hasResult = result?.status === "done";

  const charPerTok = work && estTokens(work) > 0 ? work.length / estTokens(work) : 0.95;
  const approxCh = (tok) => Math.round(tok * charPerTok).toLocaleString();

  const est = useMemo(() => {
    const combinedInst = n ? estTokens(buildCombinedInstruction(selectedIds)) : 0;
    const workTok = estTokens(work);
    /* 캐시 대상 = 시스템 + 배경정보 + 본문 / 매번 바뀌는 부분 = 질문 지시문 */
    const cacheTok = estTokens(SYSTEM_PROMPT) + estTokens(info) + workTok;
    const varTok = combinedInst + 30;
    const inputTok = cacheTok + varTok;
    const outMax = maxTokens;
    const useCache = caching || provider === "gemini";
    const writeMult = useCache && CW > 0 ? CW : 1;
    const costFull = (cacheTok * writeMult + varTok) * priceIn + outMax * priceOut;
    const costCached = (cacheTok * (useCache ? CR : 1) + varTok) * priceIn + outMax * priceOut;
    return { workTok, inputTok, outMax, costFull, costCached };
  }, [info, work, selectedIds, n, maxTokens, priceIn, priceOut, caching, provider, CR, CW]);

  const onProvider = (p) => { setProvider(p); setModel(MODELS[p].list[0].id); };
  const toggle = (id) => setSelected((s) => ({ ...s, [id]: !s[id] }));
  const toggleGroup = (g) => {
    const ids = g.questions.map((q) => q.id);
    const allOn = ids.every((id) => selected[id]);
    setSelected((s) => { const x = { ...s }; ids.forEach((id) => (x[id] = !allOn)); return x; });
  };
  const setAll = (val) => setSelected(val ? Object.fromEntries(ALL_QIDS.map((id) => [id, true])) : {});

  const calcCost = (inTok, outTok, cacheRead, cacheWrite) => {
    const uncached = Math.max(0, inTok - cacheRead - cacheWrite);
    return uncached * priceIn + cacheWrite * CW * priceIn + cacheRead * CR * priceIn + outTok * priceOut;
  };

  const run = async () => {
    setRunning(true);
    setResult({ status: "loading", text: "" });
    try {
      const instruction = buildCombinedInstruction(selectedIds);
      const { text, inTok, outTok, cacheRead, cacheWrite } = await askModel({ provider, model, apiKey, maxTokens, info, work, instruction, caching });
      const cost = calcCost(inTok, outTok, cacheRead, cacheWrite);
      setResult({ status: "done", text, usage: { inTok, outTok, cacheRead, cacheWrite, cost, modelLabel: curModel.label } });
      setUsage((s) => ({ inTok: s.inTok + inTok, outTok: s.outTok + outTok, cacheRead: s.cacheRead + cacheRead, cost: s.cost + cost, calls: s.calls + 1 }));
    } catch (e) {
      setResult({ status: "error", text: e.message || "알 수 없는 오류" });
    }
    setRunning(false);
  };

  const copyResult = () => { if (hasResult) navigator.clipboard?.writeText(result.text); };
  const safeName = () => (title || "text-analysis").trim().replace(/[\\/:*?"<>|]/g, "_").slice(0, 60) || "text-analysis";

  const buildExportHTML = () => {
    const docTitle = (title || "텍스트 분석").trim();
    const date = new Date().toLocaleString("ko-KR");
    const infoBlock = info.trim()
      ? `<div class="info"><div class="ih">작가·작품 정보 및 요구사항</div><p>${escapeHtml(info).replace(/\n/g, "<br>")}</p></div>` : "";
    const style = `
      @page{ margin:22mm 18mm; }
      body{ font-family:'Noto Serif KR',serif; color:#13293D; line-height:1.75; max-width:720px; margin:32px auto; padding:0 18px; }
      h1{ font-size:24px; margin:0 0 4px; }
      .meta{ font-family:'Noto Sans KR',sans-serif; font-size:12px; color:#4A6B85; margin-bottom:22px; border-bottom:1.5px solid #13293D; padding-bottom:12px; }
      .info{ background:#EAF4FA; border-left:3px solid #0A5BB0; padding:12px 16px; margin:0 0 26px; }
      .info .ih{ font-family:'Noto Sans KR',sans-serif; font-size:11px; letter-spacing:.1em; color:#4A6B85; margin-bottom:6px; }
      .info p{ margin:0; font-size:13.5px; }
      h2{ font-size:16px; color:#0A5BB0; border-bottom:1px solid #B6D4E4; padding-bottom:6px; margin:24px 0 10px; page-break-after:avoid; }
      h3{ font-size:15px; color:#0A5BB0; margin:18px 0 8px; } h4{ font-size:14px; margin:14px 0 6px; }
      p{ margin:0 0 10px; font-size:14px; }
    `;
    return `<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(docTitle)}</title>`
      + `<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR&display=swap" rel="stylesheet"><style>${style}</style></head>`
      + `<body><h1>${escapeHtml(docTitle)}</h1><div class="meta">분석 모델 ${escapeHtml(curModel.label)} · ${escapeHtml(date)}</div>${infoBlock}${mdToHtml(result.text)}</body></html>`;
  };
  const exportPDF = () => { if (hasResult) printHTML(buildExportHTML()); };
  const exportDocx = async () => {
    if (!hasResult || exporting) return;
    setExporting(true);
    try {
      const blob = await makeDocxBlob({ title: (title || "텍스트 분석").trim(), modelLabel: curModel.label, info, text: result.text });
      download(blob, safeName() + ".docx");
    } catch (e) {
      alert("DOCX 생성 실패: " + (e.message || e));
    }
    setExporting(false);
  };

  const overLimit = work.length >= MAX_WORK;
  const ru = result?.usage;

  return (
    <div className="dk-wrap">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@400;500&display=swap');`}</style>
      <style>{css}</style>

      <div className="dk-shell">
        <header className="dk-head">
          <div className="dk-mark">■ □ ■ &nbsp; T E X T &nbsp; A N A L Y S I S</div>
          <h1 className="dk-title">讀法<small>· 텍스트 분석 콘솔</small></h1>
          <p className="dk-sub">소설 등 서사 텍스트를 여러 관점에서 분석하는 도구입니다.</p>
        </header>

        {/* API 설정 */}
        <p className="dk-label">API 설정</p>
        <div className="dk-api">
          <div className="dk-apirow">
            <div className="dk-field">
              <label>제공자</label>
              <select className="dk-select" value={provider} onChange={(e) => onProvider(e.target.value)}>
                {Object.entries(MODELS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </div>
            <div className="dk-field">
              <label>모델</label>
              <select className="dk-select" value={model} onChange={(e) => setModel(e.target.value)}>
                {prov.list.map((m) => { const p = effectivePrice(m); return <option key={m.id} value={m.id}>{m.label} (${p.in}/${p.out}{p.promo ? " 할인" : ""})</option>; })}
              </select>
            </div>
            <div className="dk-field small">
              <label>출력 상한</label>
              <input className="dk-input" type="number" min={512} max={32768} step={256}
                value={maxTokens} onChange={(e) => setMaxTokens(Math.max(512, Math.min(32768, Number(e.target.value) || 512)))} />
            </div>
            <div className="dk-field full">
              <label>{prov.keyLabel}</label>
              <input className="dk-input" type="password" autoComplete="off" spellCheck={false}
                placeholder={prov.keyHint} value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
            </div>
          </div>
          <label className="dk-check">
            <input type="checkbox" checked={caching} onChange={(e) => setCaching(e.target.checked)} />
            프롬프트 캐싱 사용 — 같은 본문으로 다시 분석할 때 입력 비용 절감 (이 모델: 캐시분 단가의 {pct(CR)})
          </label>
          <div className="dk-apinote">
            단가 입력 ${price.in} / 출력 ${price.out} (백만 토큰당){price.promo && curModel.promo ? ` — ${curModel.promo.until}까지 할인가, 이후 $${curModel.in} / $${curModel.out}로 자동 전환` : ""}. 캐시 적중 시 해당 입력은 단가의 {pct(CR)}로 과금{CW > 0 ? `, 첫 기록 시에는 ${CW}배` : ""}.
            {provider === "gemini" && " Gemini는 공통 접두부를 자동(암묵) 캐싱하므로 체크와 무관하게 적용될 수 있고, 기록 할증은 없다."}
            {provider === "openai" && " GPT는 캐시 지점까지 1,024토큰 이상일 때만 캐싱되며, 체크를 끄면 캐싱·기록 할증 모두 없이 호출한다. 출력 상한에는 내부 추론 토큰도 포함된다."}
            {" "}키는 브라우저에서 해당 제공자로만 직접 전송되며 저장되지 않는다.
          </div>
        </div>

        {/* 작가/작품 정보 및 요구사항 */}
        <p className="dk-label">작가 · 작품 정보 및 요구사항 (선택)</p>
        <p className="dk-hint">
          작품·작가에 대한 배경뿐 아니라 분석에 대한 <b>요구사항</b>도 적을 수 있습니다. 호출에 함께 전달됩니다.<br />
          · 특정 질문을 더 깊이 분석 요청 (예: “II-1 문장의 리듬을 더 자세히”)<br />
          · ‘가능한 독법(V-5)’에 관점 추가 (예: “탈식민 관점 포함”)<br />
          · 목록에 없는 질문을 직접 추가 → 결과 맨 끝 <b>7번 항목</b>으로 출력
        </p>
        <textarea className="dk-ta info" value={info} onChange={(e) => setInfo(e.target.value)}
          placeholder={"예) 화자의 내면을 직접 서술하지 않는 문체를 의도했다.\nII-1 문장의 리듬을 특히 자세히 봐 달라.\n가능한 독법에 생태비평 관점을 추가해 달라.\n추가 질문: 제목과 본문의 관계는 어떠한가?"} />
        <div className="dk-meta">{info.length.toLocaleString()}자 · 약 {estWords(info).toLocaleString()}단어 · 추정 {estTokens(info).toLocaleString()}토큰</div>

        {/* 작품 본문 */}
        <p className="dk-label">작품 본문</p>
        <textarea className="dk-ta work" value={work} maxLength={MAX_WORK} onChange={(e) => setWork(e.target.value)}
          placeholder="여기에 작품 전문 또는 발췌를 붙여넣으세요. (최대 50,000자)" />
        <div className={"dk-meta" + (overLimit ? " warn" : "")}>
          {work.length.toLocaleString()} / {MAX_WORK.toLocaleString()}자 · 약 {estWords(work).toLocaleString()}단어 · 추정 {est.workTok.toLocaleString()}토큰{overLimit ? " · 최대치 도달" : ""}
        </div>

        {/* 비용 패널 */}

            <div className="dk-crow"><span>입력 합(추정)</span><b>{est.inputTok.toLocaleString()} <span className="sub">≈ {approxCh(est.inputTok)}자</span></b></div>
            <div className="dk-crow"><span>출력 상한</span><b>{est.outMax.toLocaleString()} <span className="sub">≈ {approxCh(est.outMax)}자</span></b></div>
            <div className="dk-crow big"><span>예상 비용 · 첫 분석</span><b>{usd(est.costFull)} · {krw(est.costFull)}</b></div>
            <div className="dk-crow big save"><span>같은 본문 재분석(캐시)</span><b>{usd(est.costCached)} · {krw(est.costCached)}</b></div>
            <div className="dk-crow"><span>실제 사용(누적)</span><b>{usage.calls}회 · 입력 {usage.inTok.toLocaleString()}{usage.cacheRead > 0 ? ` (캐시 ${usage.cacheRead.toLocaleString()})` : ""} / 출력 {usage.outTok.toLocaleString()}</b></div>
            <div className="dk-crow big"><span>실제 비용(누적)</span><b>{usd(usage.cost)} · {krw(usage.cost)}</b></div>
          </div>
          <div className="dk-costfoot">
            <b>토큰이란?</b> AI가 글을 다루는 최소 단위예요. 한국어는 대략 한 글자가 1토큰 안팎, 영어는 한 단어가 1~2토큰 정도라고 보면 됩니다(위 ‘≈자’는 본문 기준 근사 환산). · 모든 질문을 하나로 묶어 호출하므로 본문은 질문 수와 무관하게 1회만 과금됩니다. 같은 본문으로 질문을 바꿔 재분석하면 캐시가 적중해 입력비가 ‘재분석(캐시)’ 수준으로 떨어집니다. 정확한 과금은 호출 후 ‘실제 사용’을 따릅니다. 환율 가정 ₩{KRW_RATE.toLocaleString()}/$.
          </div>
        </div>

        {/* 질문 선택 */}
        <div className="dk-toolbar">
          <span className="dk-tcount">선택된 질문 <b>{n}</b> / {ALL_QIDS.length}</span>
          <button className="dk-link" onClick={() => setAll(true)}>전체 선택</button>
          <button className="dk-link" onClick={() => setAll(false)}>전체 해제</button>
        </div>

        {GROUPS.map((g) => {
          const ids = g.questions.map((q) => q.id);
          const allOn = ids.every((id) => selected[id]);
          return (
            <section className="dk-group" key={g.id}>
              <div className="dk-ghead">
                <span className="dk-num">{g.id}</span>
                <h2 className="dk-gtitle">{g.title}</h2>
                <button className="dk-gpick" onClick={() => toggleGroup(g)}>{allOn ? "묶음 해제" : "묶음 선택"}</button>
                <span className="dk-gcap">{g.caption}</span>
              </div>
              {g.questions.map((q) => {
                const on = !!selected[q.id];
                return (
                  <button key={q.id} className={"dk-q" + (on ? " on" : "")} onClick={() => toggle(q.id)} aria-pressed={on}>
                    <span className="dk-box">{on ? "■" : "□"}</span>
                    <span className="dk-qid">{q.id}</span>{q.label}
                  </button>
                );
              })}
            </section>
          );
        })}

        {/* 통합 결과 */}
        {result && (
          <section className="dk-result">
            <div className="dk-rhead">
              <span>통합 분석 결과</span>
              {hasResult && ru && (
                <small>{ru.modelLabel} · 입력 {ru.inTok.toLocaleString()}{ru.cacheRead > 0 ? ` (캐시 ${ru.cacheRead.toLocaleString()})` : ""} / 출력 {ru.outTok.toLocaleString()} · {usd(ru.cost)}</small>
              )}
            </div>
            <div className="dk-rbody">
              {result.status === "loading" && <div className="dk-load">분석 중… (질문이 많을수록 시간이 걸립니다)</div>}
              {result.status === "error" && <div className="dk-err">오류 · {result.text}</div>}
              {hasResult && <div className="dk-md" dangerouslySetInnerHTML={{ __html: mdToHtml(result.text) }} />}
            </div>
            {hasResult && (
              <div className="dk-ractions">
                <input className="dk-titlein" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="내보내기 제목 (예: 「작품명」 분석)" />
                <button className="dk-xbtn" onClick={copyResult}>전체 복사</button>
                <button className="dk-xbtn" onClick={exportPDF}>PDF로 내보내기</button>
                <button className="dk-xbtn" onClick={exportDocx} disabled={exporting}>{exporting ? "생성 중…" : "Word(.docx)로 내보내기"}</button>
              </div>
            )}
          </section>
        )}

        <div className="dk-runbar">
          <button className="dk-run" disabled={!canRun} onClick={run}>{running ? "분석 중…" : (hasResult ? "다시 분석" : "분석 시작")}</button>
          {!work.trim() && <span className="dk-progress">본문을 먼저 붙여넣으세요.</span>}
          {work.trim() && n === 0 && <span className="dk-progress">질문을 하나 이상 고르세요.</span>}
          {work.trim() && n > 0 && !apiKey.trim() && <span className="dk-progress">API 키가 없으면 호출이 실패할 수 있습니다.</span>}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
